<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Daily · 新闻工作台</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202b3a;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}header,main{max-width:1080px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:4px 0}p{line-height:1.8}small,.muted{color:#65758b}button{background:#1b634f;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}input,textarea{border:1px solid #d5dbe3;border-radius:6px;padding:10px;font:inherit}input{max-width:250px}textarea{width:100%;min-height:160px;font:13px/1.6 monospace}summary{cursor:pointer}details,.card{background:white;border:1px solid #e0e5eb;border-radius:12px;padding:22px;margin-bottom:18px}.card h2{font-size:21px;line-height:1.5;margin:12px 0}.body{white-space:pre-wrap}.badge{background:#edf1f5;padding:5px 9px;border-radius:5px;font-size:12px;display:inline-block}.ready{background:#e3f3e9;color:#226d47}.needs_review{background:#fff2df;color:#9c5a1b}a{color:#256e59;overflow-wrap:anywhere}.shot{max-width:100%;max-height:760px;object-fit:contain;display:block;margin:18px 0;border:1px solid #eee}#notice{white-space:pre-wrap;color:#5c6878;font-size:13px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.source{margin:5px 0}.stamp{margin-top:20px;font-size:12px;color:#6b788a}#empty{padding:60px;text-align:center}main{padding-top:0}@media(max-width:650px){header,main{padding:18px}header{align-items:start;gap:20px;flex-direction:column}}
</style></head><body>
<header><div><small>AI DAILY / EDITOR DESK</small><h1>新闻工作台</h1><small>Grok 来稿 · 信源 · 推文截图</small></div><div class="actions"><input id="key" type="password" placeholder="正式模式填接入密钥" autocomplete="off"><button id="refresh">刷新</button></div></header>
<main>
<details><summary>粘贴 Grok JSON 来稿</summary><p class="muted">双语来稿使用 /api/v2/news，包含中英标题、摘要和正文。重复 run_id 不重复入库。正式启用 Telegram 时，新来稿会自动排队发送。</p><textarea id="payload" placeholder='{"schema_version":"2","run_id":"...","generated_at":"...","items":[...]}'></textarea><p><button id="submit">接收来稿</button></p></details>
<details><summary>上传一张 X 原帖截图（可选）</summary><p class="muted">仅上传单张完整原文 PNG。外部文章和放不下的长推文只保留链接。</p><div class="actions"><input id="source-url" type="url" placeholder="https://x.com/作者/status/ID"><input id="png" type="file" accept="image/png"><button id="upload">上传并取得图片 ID</button></div></details>
<div class="actions"><button id="zh">中文预览</button><button id="en">English preview</button><small id="delivery"></small></div><p id="notice"></p><div id="feed"></div></main>
<script>
const $=id=>document.getElementById(id);let objectUrls=[],lang='zh';
async function api(url,options={}){const headers={...options.headers};if($('key').value)headers.Authorization='Bearer '+$('key').value;const r=await fetch(url,{...options,headers});if(!r.ok)throw new Error(await r.text());return r;}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
const states={queued:'旧版截图排队中',processing:'旧版截图处理中',ready:'已入库',needs_review:'需要检查'};
const deliveryStates={pending:'等待发送',sending:'发送中',sent:'已发送',failed:'发送失败',uncertain:'送达待检查'};
async function refresh(){try{
const [data,queue]=await Promise.all([(await api('/api/items')).json(),(await api('/api/telegram/outbox')).json()]);
$('delivery').textContent=queue.enabled?'Telegram 已启用 · 仅发送中文':'Telegram 未启用 · 当前仅预览';
const jobs=Object.fromEntries(queue.items.map(j=>[j.news_id,j]));
objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];$('feed').replaceChildren();
if(!data.items.length)$('feed').append(el('div','还没有新闻。粘贴双语 JSON，或由 Grok 调用接收接口。','muted'));
for(const item of data.items){
const n=item.news;const l=n['title_'+lang]?lang:'zh';const card=el('article',undefined,'card');
card.append(el('span',states[item.state]||item.state,'badge '+item.state),el('h2',n['title_'+l]));
if(n['summary_'+l])card.append(el('p',n['summary_'+l]));
if(item.image){const img=el('img',undefined,'shot');img.alt='原帖截图 · Grok 提供';const blob=await (await api('/api/items/'+item.id+'/image')).blob();img.src=URL.createObjectURL(blob);objectUrls.push(img.src);card.append(img,el('small',img.alt));}
const full=el('details');full.append(el('summary',l==='zh'?'展开完整报道':'Read full report'),el('p',n['body_'+l],'body'));
const caveats=n[l==='zh'?'uncertainties':'uncertainties_en']||[];if(caveats.length)full.append(el('p',(l==='zh'?'待核实：':'Uncertainties: ')+caveats.join('；'),'muted'));card.append(full);
const sources=[...n.sources];if(n.tweet_url&&!sources.some(s=>s.url===n.tweet_url))sources.push({label:l==='zh'?'原推文':'Original post',url:n.tweet_url});
for(const source of sources){const line=el('div',undefined,'source'),a=el('a',source.label);a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';line.append(a);card.append(line);}
const job=jobs[item.id];card.append(el('p','信源发布时间 '+(n.published_at||n.published_date||'未确认')+(job?' · Telegram '+(deliveryStates[job.status]||job.status):''),'stamp'));
const actions=el('div',undefined,'actions');const copy=el('button','复制中文完整稿');copy.onclick=async()=>{try{const text=await(await api('/api/items/'+item.id+'/markdown')).text();await navigator.clipboard.writeText(text);copy.textContent='已复制';}catch(e){$('notice').textContent=e.message;}};actions.append(copy);
if(job){const preview=el('button','查看频道正文');preview.onclick=async()=>{try{const p=await(await api('/api/items/'+item.id+'/telegram-preview')).json();$('notice').textContent='频道文本预览（未发送）：\n'+p.caption_html;}catch(e){$('notice').textContent=e.message;}};actions.append(preview);}
card.append(actions);$('feed').append(card);
}
$('notice').textContent='最近 '+data.items.length+' 条来稿；入库不代表事实已核验或网站已发布。';
}catch(e){$('notice').textContent=e.message;}}
$('refresh').onclick=refresh;$('zh').onclick=()=>{lang='zh';refresh();};$('en').onclick=()=>{lang='en';refresh();};
$('submit').onclick=async()=>{try{const body=JSON.parse($('payload').value);const url=body.schema_version==='2'?'/api/v2/news':'/webhooks/grok';const result=await(await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();await refresh();$('notice').textContent=JSON.stringify(result,null,2);}catch(e){$('notice').textContent=e.message;}};
$('upload').onclick=async()=>{try{const file=$('png').files[0];if(!file)throw new Error('请先选择 PNG');const query=new URLSearchParams({kind:'x_original',source_url:$('source-url').value});const result=await(await api('/api/assets?'+query,{method:'POST',headers:{'Content-Type':'image/png'},body:file})).json();$('notice').textContent='上传完成，把 asset_id 填入对应新闻的 screenshot_asset_id：\n'+JSON.stringify(result,null,2);}catch(e){$('notice').textContent=e.message;}};
refresh();
</script></body></html>
